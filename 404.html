<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Page not found · Bell &amp; Broom</title>
<style>
:root { --cream: #EDE6D0; --navy: #1E2F4A; --tan: #D9C5A5; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--cream); color: var(--navy); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
header { background: var(--navy); padding: 16px; }
header a { color: var(--cream); font-weight: 700; text-decoration: none; }
main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 64px 16px; }
h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.2; }
p { margin: 0 0 24px; font-size: 18px; }
.btn { display: inline-block; background: var(--navy); color: var(--cream); padding: 12px 24px; border-radius: 6px; font-weight: 600; text-decoration: none; }
.btn:focus-visible, header a:focus-visible { outline: 3px solid var(--tan); outline-offset: 4px; }
</style>
</head>
<body>
<header><a href="/">Bell &amp; Broom</a></header>
<main>
  <h1>Page not found</h1>
  <p>We could not find that page. It may have moved, or the link may be wrong.</p>
  <a class="btn" href="/">Back to the home page</a>
</main>
</body>
</html>
